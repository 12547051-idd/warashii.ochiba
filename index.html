qqq";
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),rnd=(a,b)=>a+Math.random()*(b-a);
let W,H,DPR=Math.min(devicePixelRatio||1,2),leaves=[],S={w:0,h:0,k:1,ox:0,oy:0,custom:false},V=[];
const COLS=['#f3c53a','#e8ad25','#dba23f','#cf9030','#ebd37c','#c27f2c','#f0b93a','#d9b24e'];

// ---- 銀杏の葉(プレースホルダー)。自前のSVGは右下ボタンかドロップで差し替え
function variant(){const n=24,a0=-Math.PI/2-.95,a1=-Math.PI/2+.95,ph=rnd(0,6);let pts=[];
  for(let i=0;i<=n;i++){const t=i/n,a=a0+(a1-a0)*t;let r=44+Math.sin(t*10+ph)*1.6-Math.exp(-(((t-.5)/.05)**2))*rnd(14,22);pts.push([Math.cos(a)*r,Math.sin(a)*r+14])}
  let d='M0 14',v='';pts.forEach(p=>d+=`L${p[0].toFixed(1)} ${p[1].toFixed(1)}`);
  pts.forEach((p,i)=>{if(i%3==0&&i>0&&i<n)v+=`M0 14L${p[0].toFixed(1)} ${p[1].toFixed(1)}`});
  return{p:new Path2D(d+'Z'),v:new Path2D(v)}}
function fit(){W=cv.clientWidth;H=cv.clientHeight;cv.width=W*DPR;cv.height=H*DPR;
  if(S.custom){S.k=Math.max(W/S.w,H/S.h,S.mk||0);S.ox=(W-S.w*S.k)/2-(S.x0||0)*S.k;S.oy=(H-S.h*S.k)/2-(S.y0||0)*S.k}else{S.w=W;S.h=H;S.k=1;S.ox=S.oy=0}}
function build(){fit();leaves=[];
  if(S.custom)return;
  if(!V.length)for(let i=0;i<12;i++)V.push(variant());
  const n=Math.min(1400,Math.round((W+120)*(H+120)/1900));
  for(let i=0;i<n;i++){const v=V[i%12],s=rnd(.45,.95)*Math.max(.8,Math.min(W,H)/520),x=rnd(-60,W+60),y=rnd(-60,H+60),r=rnd(0,6.28);
    leaves.push({p:v.p,v:v.v,cx:0,cy:0,x,y,hx:x,hy:y,r,hr:r,s,vx:0,vy:0,vr:0,c:COLS[(Math.random()*COLS.length)|0]})}}

// ---- 既定:落ち葉7.svg(土台の長方形の範囲を画面いっぱいに。葉1枚が約56px以上になる倍率)
function useDefault(){S.custom=true;S.x0=2842.34;S.y0=1523.32;S.w=7600.47;S.h=10506.11;S.mk=.11;
  leaves=DATA.map(o=>({p:new Path2D(o[0]),v:null,c:o[1],cx:o[2],cy:o[3],a:o[4],f:o[5],x:o[2],y:o[3],hx:o[2],hy:o[3],r:0,hr:0,s:1,vx:0,vy:0,vr:0}));fit()}
// ---- SVG読み込み:各<path>を1枚の葉として扱う(bbox中心で回転)
function loadSVG(txt){const svg=new DOMParser().parseFromString(txt,'image/svg+xml').documentElement;
  const host=document.createElement('div');host.style.cssText='position:absolute;visibility:hidden;width:0;height:0;overflow:hidden';
  host.appendChild(document.importNode(svg,true));document.body.appendChild(host);
  const el=host.firstElementChild,vb=(el.getAttribute('viewBox')||'').trim().split(/[ ,]+/).map(Number),out=[];
  el.querySelectorAll('path').forEach(p=>{try{const b=p.getBBox(),f=getComputedStyle(p).fill;if(!p.getAttribute('d')||!b.width)return;
    const cx=b.x+b.width/2,cy=b.y+b.height/2;
    out.push({p:new Path2D(p.getAttribute('d')),v:null,cx,cy,x:cx,y:cy,hx:cx,hy:cy,r:0,hr:0,s:1,vx:0,vy:0,vr:0,c:f&&f!=='none'?f:'#d9a441'})}catch(e){}});
  const bb=el.getBBox();host.remove();if(!out.length)return alert('pathが見つかりませんでした');
  S.custom=true;S.x0=S.y0=S.mk=0;S.w=vb.length==4&&vb[2]?vb[2]:bb.x+bb.width;S.h=vb.length==4&&vb[3]?vb[3]:bb.y+bb.height;fit();leaves=out}
document.getElementById('f').onchange=e=>e.target.files[0]?.text().then(loadSVG);
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();e.dataTransfer.files[0]?.text().then(loadSVG)});
document.getElementById('r').onclick=useDefault;
const fs=document.getElementById('fs'),de=document.documentElement;
if(!de.requestFullscreen&&!de.webkitRequestFullscreen)fs.hidden=true;
fs.onclick=()=>{if(document.fullscreenElement||document.webkitFullscreenElement)(document.exitFullscreen||document.webkitExitFullscreen).call(document);else(de.requestFullscreen||de.webkitRequestFullscreen).call(de)};

// ---- 音:押す=踏み締める / なぞる=踏み分ける(足音サンプルを鳴らす)
const SPR=[[0.1, 0.85, "p"], [1.05, 0.85, "p"], [2.0, 0.85, "p"], [2.95, 0.85, "p"], [3.9, 0.85, "p"], [4.85, 0.85, "p"], [5.8, 0.85, "p"], [6.75, 0.262, "w"], [7.112, 0.29, "w"], [7.502, 0.257, "w"], [7.859, 0.25, "w"], [8.209, 0.25, "w"], [8.559, 0.263, "w"], [8.922, 0.25, "w"], [9.272, 0.315, "w"], [9.687, 0.25, "w"], [10.037, 0.313, "w"], [10.451, 0.284, "w"], [10.834, 0.289, "w"], [11.223, 0.273, "w"], [11.596, 0.372, "w"]];
let ac,buf,master,lastW=0,acc=0,nextStep=40;const pi=[],wi=[];SPR.forEach((s,i)=>(s[2]=='p'?pi:wi).push(i));
function makeIR(){const r=ac.sampleRate,L=(r*1.3)|0,b=ac.createBuffer(2,L,r),pd=(r*.025)|0;
  for(let c=0;c<2;c++){const d=b.getChannelData(c);let y=0;for(let i=pd;i<L;i++){const t=(i-pd)/r,k=.55+.4*Math.min(t/.8,1);y=y*k+(Math.random()*2-1)*(1-k);d[i]=y*Math.exp(-t*4)*3.2}}return b}
async function audioInit(){if(ac){if(ac.state=='suspended')await ac.resume();return}
  ac=new(window.AudioContext||window.webkitAudioContext)();const lim=ac.createDynamicsCompressor();master=ac.createGain();lim.connect(ac.destination);
  // 奥行き:短い響き(リバーブ)+ごく薄いエコー
  const conv=ac.createConvolver(),wet=ac.createGain(),dl=ac.createDelay(1),fb=ac.createGain(),lp=ac.createBiquadFilter(),dw=ac.createGain();
  conv.buffer=makeIR();wet.gain.value=.24;dl.delayTime.value=.19;fb.gain.value=.24;lp.type='lowpass';lp.frequency.value=3000;dw.gain.value=.13;
  master.connect(lim);master.connect(conv);conv.connect(wet);wet.connect(lim);
  master.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(dw);dw.connect(lim);
  const bin=atob(MP3),u=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k);
  buf=await ac.decodeAudioData(u.buffer)}
function play(k,gain,rate,pan){if(!buf)return;const[off,dur]=SPR[k],t=ac.currentTime,s=ac.createBufferSource(),g=ac.createGain(),p=ac.createStereoPanner(),e=t+dur/rate;
  s.buffer=buf;s.playbackRate.value=rate;g.gain.setValueAtTime(gain,t);g.gain.setValueAtTime(gain,e-.02);g.gain.linearRampToValueAtTime(0,e);
  p.pan.value=pan;s.connect(g);g.connect(p);p.connect(master);s.start(t,off,dur)}
const pick=a=>a[(Math.random()*a.length)|0];
function press(){play(pick(pi),rnd(.75,1),rnd(.94,1.06),rnd(-.25,.25))}
function wade(sum,sp){const now=performance.now();acc+=sp;
  if(acc<nextStep||sum<.05||now-lastW<45)return;acc=0;nextStep=rnd(30,60);lastW=now;if(!ac||!buf)return;
  const v=Math.min(1,.3+sp/45),d=Math.min(1,sum*.6);
  play(pick(wi),Math.min(1,v*(.4+.6*d))*rnd(.7,1),rnd(.92,1.1)+Math.min(sp/400,.15),rnd(-.4,.4))}
function stomp(e){const b=cv.getBoundingClientRect(),x=(e.clientX-b.left-S.ox)/S.k,y=(e.clientY-b.top-S.oy)/S.k,r=R*1.5/S.k;
  for(const l of leaves){if(l.f)continue;const dx=l.x-x,dy=l.y-y,d=Math.hypot(dx,dy);if(d>r)continue;const f=(1-d/r)**1.5,u=d||1;
    l.vx+=dx/u*(4/S.k)*f;l.vy+=dy/u*(4/S.k)*f;l.vr+=(Math.random()-.5)*.6*f}}

// ---- 操作:触れた葉が弾かれ、回転し、ゆっくり戻る
let last=null;const R=84;
function poke(e){const b=cv.getBoundingClientRect(),x=(e.clientX-b.left-S.ox)/S.k,y=(e.clientY-b.top-S.oy)/S.k;
  const pvx=last?(x-last.x):0,pvy=last?(y-last.y):0,sp=Math.hypot(pvx,pvy)*S.k;last={x,y};
  if(e.pointerType==='mouse'&&!e.buttons&&!ac)return;
  const r=R/S.k;let sum=0;
  for(const l of leaves){if(l.f)continue;const dx=l.x-x,dy=l.y-y,d=Math.hypot(dx,dy);if(d>r)continue;const f=(1-d/r)**2,u=d||1;sum+=f;
    l.vx+=(dx/u*(1.2/S.k)+pvx*.35)*f;l.vy+=(dy/u*(1.2/S.k)+pvy*.35)*f;l.vr+=(Math.random()-.5)*.4*f*(1+sp*.05)+(pvx>0?.03:-.03)*f}
  wade(sum,sp)}
cv.addEventListener('pointerdown',e=>{audioInit().then(press);acc=0;stomp(e);last=null;document.getElementById('hint').style.opacity=0;cv.setPointerCapture(e.pointerId);poke(e)});
cv.addEventListener('pointermove',poke);
cv.addEventListener('pointerleave',()=>last=null);

function frame(){ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--bg');ctx.fillRect(0,0,cv.width,cv.height);
  const a=DPR*S.k,m=800,x0=-S.ox/S.k-m,x1=(W-S.ox)/S.k+m,y0=-S.oy/S.k-m,y1=(H-S.oy)/S.k+m;
  for(const l of leaves){
    if(!l.f){l.vx+=(l.hx-l.x)*.0035;l.vy+=(l.hy-l.y)*.0035;l.vr+=(l.hr-l.r)*.003;l.vx*=.9;l.vy*=.9;l.vr*=.9;l.x+=l.vx;l.y+=l.vy;l.r+=l.vr;
      if(l.x<x0||l.x>x1||l.y<y0||l.y>y1)continue}
    const c=Math.cos(l.r)*l.s,s=Math.sin(l.r)*l.s;
    ctx.setTransform(a*c,a*s,-a*s,a*c,a*l.x+DPR*S.ox,a*l.y+DPR*S.oy);ctx.translate(-l.cx,-l.cy);
    ctx.globalAlpha=l.a||1;ctx.fillStyle=l.c;ctx.fill(l.p);
    if(l.v){ctx.strokeStyle='rgba(120,70,20,.32)';ctx.lineWidth=1.1;ctx.stroke(l.v)}
  }ctx.globalAlpha=1;requestAnimationFrame(frame)}
addEventListener('resize',()=>{const was=S.custom;if(was)fit();else build()});
useDefault();frame();
